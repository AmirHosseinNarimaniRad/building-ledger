services:
  db:
    # Docker Hub may be unreachable from Iranian servers; point POSTGRES_IMAGE at a mirror there.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ledger_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_owner_dev}
      POSTGRES_DB: ledger
      TZ: Asia/Tehran
    ports:
      - "127.0.0.1:5432:5432"   # dev only: never reachable from the LAN
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_owner -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:

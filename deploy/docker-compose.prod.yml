# Production stack. From the deploy/ folder:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
name: ledger

x-app: &app
  image: ${APP_IMAGE:-building-ledger:latest}
  build:
    context: ..
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ledger
      TZ: Asia/Tehran
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_owner -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the app and the backup job reach the database.

  # Applies db/migrations as the owner role, sets app_user's password, then exits.
  migrate:
    <<: *app
    command: ["node", "migrate.cjs"]
    restart: "no"
    environment:
      DATABASE_OWNER_URL: postgres://ledger_owner:${POSTGRES_PASSWORD}@db:5432/ledger
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@db:5432/ledger
      RESIDENT_TOKEN_KEY: ${RESIDENT_TOKEN_KEY:?set RESIDENT_TOKEN_KEY in .env}
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}${PUBLIC_PORT_SUFFIX:-}
      SMS_SENDER: ${SMS_SENDER:-console}
      RECEIPT_EXTRACTOR: ${RECEIPT_EXTRACTOR:-mock}
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy

  # Daily pg_dump + receipt images, kept KEEP_DAYS days in ./backups. Copy them off the server too.
  backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ledger_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ledger
      KEEP_DAYS: ${KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Asia/Tehran
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/data/storage:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage:
  certbot-www:
